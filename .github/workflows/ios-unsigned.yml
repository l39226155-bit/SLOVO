name: iOS unsigned IPA

# Builds an UNSIGNED .ipa on a macOS runner. Useful without an Apple account:
# the artifact must still be signed (e.g. Sideloadly/AltStore with your own
# Apple ID) before it can be installed on a device.
on:
  workflow_dispatch:

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Resolve workspace and scheme
        id: xcode
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # The app scheme is the workspace name; the first listed scheme can be a Pod (e.g. boost).
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -list
          test -n "$SCHEME" || { echo "No scheme name derived"; exit 1; }
          xcodebuild -workspace "$WORKSPACE" -list | grep -qE "^[[:space:]]*${SCHEME}[[:space:]]*$" || { echo "Scheme $SCHEME not found in workspace"; exit 1; }
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using $WORKSPACE / $SCHEME"

      - name: Archive without code signing
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/SLOVO.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ios/build/SLOVO.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH" || { echo "No .app in archive"; find ios/build/SLOVO.xcarchive -maxdepth 3; exit 1; }
          echo "App: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry ../SLOVO-unsigned.ipa Payload
          ls -lh ../SLOVO-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SLOVO-unsigned-ipa
          path: SLOVO-unsigned.ipa
          if-no-files-found: error
